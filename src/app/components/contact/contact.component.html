<section id="contact" class="contact">
  <div class="contact-inner">
    <p class="section-label">06 / CONTACT</p>
    <h2>Have a project<br />in <span>mind?</span></h2>
    <p class="contact-lead">
      I'm open to Full-Stack, Laravel and Angular opportunities.
    </p>

    <a class="big-email" [href]="emailHref">
      {{ emailLabel }} <span aria-hidden="true">↗</span>
    </a>

    <div class="contact-links">
      <a [href]="githubHref" target="_blank" rel="noopener noreferrer">
        GitHub <span aria-hidden="true">↗</span>
      </a>
      <a [href]="linkedinHref" target="_blank" rel="noopener noreferrer">
        LinkedIn <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
</section>
